<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>众包测试平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }

        .content { padding: 30px; }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            margin-top: 12px;
        }

        .user-info {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .user-info .points {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        .user-info .label { color: #666; font-size: 14px; }

        .question-card {
            background: #f8f9fa;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .question-card h3 {
            margin-bottom: 20px;
            color: #333;
            line-height: 1.5;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-size: 15px;
        }
        .option-btn:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }
        .option-btn.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .hidden { display: none; }
        .error { color: #e74c3c; font-size: 14px; margin-bottom: 12px; text-align: center; }
        .success { color: #27ae60; font-size: 14px; margin-bottom: 12px; text-align: center; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录页面 -->
        <div id="login-page">
            <div class="header">
                <h1>众包测试平台</h1>
                <p>参与AI测试，获得积分奖励</p>
            </div>
            <div class="content">
                <div id="login-error" class="error hidden"></div>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="login-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码">
                </div>
                <button class="btn btn-primary" onclick="login()">登录</button>
                <button class="btn btn-secondary" onclick="showRegister()">注册新账号</button>
            </div>
        </div>

        <!-- 注册页面 -->
        <div id="register-page" class="hidden">
            <div class="header">
                <h1>注册账号</h1>
                <p>加入我们，一起测试AI</p>
            </div>
            <div class="content">
                <div id="register-error" class="error hidden"></div>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="register-username" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="register-password" placeholder="请输入密码">
                </div>
                <button class="btn btn-primary" onclick="register()">注册</button>
                <button class="btn btn-secondary" onclick="showLogin()">返回登录</button>
            </div>
        </div>

        <!-- 答题页面 -->
        <div id="task-page" class="hidden">
            <div class="header">
                <h1>测试任务</h1>
                <p>完成测试获得积分</p>
            </div>
            <div class="content">
                <div class="user-info">
                    <div class="label">当前积分</div>
                    <div class="points" id="user-points">0</div>
                </div>

                <div id="no-task" class="hidden">
                    <p style="text-align: center; color: #666; padding: 40px 0;">
                        暂无可用题目，请稍后再来
                    </p>
                </div>

                <div id="question-container" class="hidden">
                    <div class="question-card">
                        <h3 id="question-content">题目内容</h3>
                        <div class="options" id="question-options"></div>
                    </div>
                    <button class="btn btn-primary" onclick="submitAnswer()">提交答案</button>
                </div>

                <div id="answer-success" class="hidden">
                    <p class="success" style="font-size: 18px; padding: 20px 0;">
                        答案已提交！ +<span id="earned-points">10</span> 积分
                    </p>
                    <button class="btn btn-primary" onclick="getNextQuestion()">下一题</button>
                </div>

                <button class="btn btn-secondary" onclick="logout()" style="margin-top: 20px;">退出登录</button>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        let currentQuestion = null;
        let startTime = null;
        let selectedAnswer = null;
        let lockExpiresAt = null;
        let countdownTimer = null;

        // 检查登录状态
        if (token) {
            showTaskPage();
            loadUserInfo();
            getNextQuestion();
        }

        function showLogin() {
            document.getElementById('login-page').classList.remove('hidden');
            document.getElementById('register-page').classList.add('hidden');
            document.getElementById('task-page').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('register-page').classList.remove('hidden');
            document.getElementById('task-page').classList.add('hidden');
        }

        function showTaskPage() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('register-page').classList.add('hidden');
            document.getElementById('task-page').classList.remove('hidden');
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            const res = await fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                token = data.access_token;
                localStorage.setItem('token', token);
                showTaskPage();
                loadUserInfo();
                getNextQuestion();
            } else {
                const errorEl = document.getElementById('login-error');
                errorEl.textContent = data.detail || '登录失败';
                errorEl.classList.remove('hidden');
            }
        }

        async function register() {
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;

            const res = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                token = data.access_token;
                localStorage.setItem('token', token);
                showTaskPage();
                loadUserInfo();
                getNextQuestion();
            } else {
                const errorEl = document.getElementById('register-error');
                errorEl.textContent = data.detail || '注册失败';
                errorEl.classList.remove('hidden');
            }
        }

        async function loadUserInfo() {
            const res = await fetch('/api/users/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            document.getElementById('user-points').textContent = data.points;
        }

        async function getNextQuestion() {
            // 清除之前的倒计时
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }

            document.getElementById('question-container').classList.add('hidden');
            document.getElementById('answer-success').classList.add('hidden');
            document.getElementById('no-task').classList.add('hidden');

            const res = await fetch('/api/questions/next', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 404) {
                document.getElementById('no-task').classList.remove('hidden');
                return;
            }

            const data = await res.json();
            currentQuestion = data;
            startTime = Date.now();
            selectedAnswer = null;

            // 保存锁定过期时间
            lockExpiresAt = data.lock_expires_at ? new Date(data.lock_expires_at) : null;

            document.getElementById('question-content').textContent = data.content;

            const optionsContainer = document.getElementById('question-options');
            optionsContainer.innerHTML = '';

            data.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectOption(btn, option);
                optionsContainer.appendChild(btn);
            });

            // 添加倒计时显示
            if (lockExpiresAt) {
                const timerDiv = document.getElementById('timer-display') || createTimerDisplay();
                timerDiv.classList.remove('hidden');
                updateCountdown();
                countdownTimer = setInterval(updateCountdown, 1000);
            }

            document.getElementById('question-container').classList.remove('hidden');
        }

        function createTimerDisplay() {
            const div = document.createElement('div');
            div.id = 'timer-display';
            div.style.cssText = 'text-align: center; padding: 10px; background: #fff3cd; border-radius: 8px; margin-bottom: 15px; color: #856404; font-weight: 500;';
            div.innerHTML = '剩余时间: <span id="countdown">60</span>秒';
            const container = document.getElementById('question-container');
            container.insertBefore(div, container.firstChild);
            return div;
        }

        function updateCountdown() {
            if (!lockExpiresAt) return;
            const remaining = Math.max(0, Math.floor((lockExpiresAt - new Date()) / 1000));
            const timerEl = document.getElementById('countdown');
            if (timerEl) {
                timerEl.textContent = remaining;
            }
            if (remaining <= 0) {
                clearInterval(countdownTimer);
                alert('答题时间已超时，题目将被释放');
                getNextQuestion();
            }
        }

        function selectOption(btn, option) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedAnswer = option;
        }

        async function submitAnswer() {
            if (!selectedAnswer) {
                alert('请选择一个选项');
                return;
            }

            // 清除倒计时
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }

            const timeSpent = Math.floor((Date.now() - startTime) / 1000);

            const res = await fetch('/api/answers', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    question_id: currentQuestion.question_id,
                    answer: selectedAnswer,
                    time_spent: timeSpent
                })
            });

            const data = await res.json();
            if (res.ok) {
                document.getElementById('question-container').classList.add('hidden');
                const timerDiv = document.getElementById('timer-display');
                if (timerDiv) timerDiv.classList.add('hidden');
                document.getElementById('earned-points').textContent = data.points_earned;
                document.getElementById('user-points').textContent = data.current_points;
                document.getElementById('answer-success').classList.remove('hidden');
            } else {
                alert(data.detail || '提交失败');
                if (data.detail.includes('已回答') || data.detail.includes('足够') || data.detail.includes('超时') || data.detail.includes('释放')) {
                    getNextQuestion();
                }
            }
        }

        function logout() {
            localStorage.removeItem('token');
            token = null;
            showLogin();
        }
    </script>
</body>
</html>
